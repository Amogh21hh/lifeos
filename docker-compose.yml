# Production-style stack: LIFEOS + PostgreSQL 17 with pgvector.
# For local development you don't need this — `npm run dev` uses embedded PGlite.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://lifeos:lifeos@db:5432/lifeos
      STORAGE_DIR: /data/uploads
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - uploads:/data/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
